<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0f17" />
  <title>荻60 バスタイマー</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main id="app">
    <header class="topbar">
      <div class="now" id="now">--:--</div>
      <div class="day-type" id="dayType">--</div>
    </header>

    <section class="direction-switch">
      <button class="dir-btn" data-dir="home_to_station" id="btnHome2Sta">春日神社 → 荻窪駅</button>
      <button class="dir-btn" data-dir="station_to_home" id="btnSta2Home">荻窪駅 → 春日神社</button>
    </section>

    <section class="next-bus">
      <div class="label">次のバス</div>
      <div class="countdown">
        <span class="count" id="count1">--</span>
        <span class="unit">分後</span>
      </div>
      <div class="time" id="time1">--:--</div>
    </section>

    <section class="upcoming">
      <div class="row">
        <div class="rank">2本目</div>
        <div class="time-mid" id="time2">--:--</div>
        <div class="count-mid"><span id="count2">--</span>分後</div>
      </div>
      <div class="row">
        <div class="rank">3本目</div>
        <div class="time-mid" id="time3">--:--</div>
        <div class="count-mid"><span id="count3">--</span>分後</div>
      </div>
    </section>

    <footer class="footer">
      <div class="route-info" id="routeInfo">荻60 宮前三丁目経由</div>
      <div class="revised" id="revisedDate"></div>
      <button id="reloadBtn" class="reload">再読み込み</button>
    </footer>
  </main>

  <script src="app.js"></script>
</body>
</html>
